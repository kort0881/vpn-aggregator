name: Pipeline Report

on:
  schedule:
    - cron: '0 2 * * 0'  # раз в неделю, воскресенье 02:00 UTC
  workflow_dispatch:

# Предотвращает одновременный запуск двух отчётов.
# Второй запуск встанет в очередь, а не полезет параллельно.
concurrency:
  group: pipeline-report
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline (with Reporter)
        run: python pipeline.py

      - name: Download GeoLite2 databases
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL --retry 3 -o data/GeoLite2-Country.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb
          curl -fsSL --retry 3 -o data/GeoLite2-ASN.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
          ls -lh data/

      - name: Run GeoIP pipeline
        run: python geoip_pipeline.py

      - name: Show reports (debug)
        run: |
          echo "=== pipeline_report.md ==="
          cat sources_meta/pipeline_report.md || true
          echo
          echo "=== geoip_report.md ==="
          cat sources_meta/geoip_report.md || true

      - name: Commit and push reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update pipeline & GeoIP reports [skip ci]"
          file_pattern: "sources_meta/pipeline_report.md sources_meta/geoip_report.md"
          branch: main
