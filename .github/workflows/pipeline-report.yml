name: Pipeline Report

on:
  schedule:
    - cron: '0 2 * * 0'  # раз в неделю, воскресенье 02:00 UTC
  workflow_dispatch:

# Гарантирует, что два запуска этого workflow не пойдут одновременно.
# Если предыдущий ещё идёт — новый встанет в очередь.
concurrency:
  group: pipeline-report
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline (with Reporter)
        run: |
          python pipeline.py

      - name: Commit pipeline report if any
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sources_meta/pipeline_report.md
          if git diff --cached --quiet; then
            echo "No pipeline_report changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update pipeline report"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            # Подтягиваем свежие изменения с удалённого main и переносим свой коммит поверх
            if ! git pull --rebase origin main; then
              echo "Rebase failed — resolving by taking our version of the report"
              # Если в отчёте конфликт — оставляем свою (свежую) версию
              git checkout --ours sources_meta/pipeline_report.md
              git add sources_meta/pipeline_report.md
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed, retrying in 5s..."
            sleep 5
          done
          echo "Push failed after 5 attempts"
          exit 1
