name: Pipeline Report

on:
  schedule:
    - cron: '0 2 * * 0'  # раз в неделю, воскресенье 02:00 UTC
  workflow_dispatch:

concurrency:
  group: pipeline-report
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline (with Reporter)
        run: python pipeline.py

      - name: Download GeoLite2 databases
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL --retry 3 -o data/GeoLite2-Country.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb
          curl -fsSL --retry 3 -o data/GeoLite2-ASN.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
          ls -lh data/

      - name: Run GeoIP pipeline
        run: python geoip_pipeline.py

      - name: Show reports (debug)
        run: |
          echo "=== pipeline_report.md ==="
          cat sources_meta/pipeline_report.md || true
          echo
          echo "=== geoip_report.md ==="
          cat sources_meta/geoip_report.md || true

      - name: Commit and push reports
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Сохраняем сгенерированные отчёты, чтобы reset их не снёс
          tmp="$(mktemp -d)"
          cp sources_meta/pipeline_report.md "$tmp/pipeline_report.md"
          cp sources_meta/geoip_report.md    "$tmp/geoip_report.md"

          # 2. Приводим локальную ветку к актуальному состоянию remote.
          #    Это защищает от force-push'ей и гонок с другими воркфлоу.
          git fetch origin main
          git reset --hard origin/main

          # 3. Возвращаем отчёты и коммитим, если есть изменения
          cp "$tmp/pipeline_report.md" sources_meta/pipeline_report.md
          cp "$tmp/geoip_report.md"    sources_meta/geoip_report.md

          git add sources_meta/pipeline_report.md sources_meta/geoip_report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Auto-update pipeline & GeoIP reports [skip ci]"

          # 4. Пуш с повтором: если между fetch и push кто-то успел запушить,
          #    ребейзим наш единственный коммит поверх и пробуем снова.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i), pulling --rebase and retrying"
            git pull --rebase origin main
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
