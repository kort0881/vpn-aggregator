name: Pipeline Report

on:
  schedule:
    - cron: '0 2 * * 0'  # раз в неделю, воскресенье 02:00 UTC
  workflow_dispatch:

# Предотвращает одновременный запуск двух отчётов.
# Второй запуск встанет в очередь, а не полезет параллельно.
concurrency:
  group: pipeline-report
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline (with Reporter)
        run: |
          python pipeline.py

      - name: Commit and push pipeline report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update pipeline report"
          file_pattern: "sources_meta/pipeline_report.md"
          branch: main
