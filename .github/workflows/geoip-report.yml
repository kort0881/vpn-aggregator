name: GeoIP Report

on:
  schedule:
    - cron: '0 3 * * *'   # раз в сутки по UTC
  workflow_dispatch:

concurrency:
  group: geoip-report
  cancel-in-progress: false

jobs:
  geoip-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GeoIP pipeline
        run: |
          python geoip_pipeline.py

      - name: Debug — что реально создалось
        if: always()
        run: |
          ls -la sources_meta/ 2>/dev/null || echo "sources_meta отсутствует"
          find . -name 'geoip_report.md' -print

      - name: Commit & push GeoIP report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # -A подхватит и новые, и изменённые; || true — не падать если файла нет
          git add -A -- sources_meta/geoip_report.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No GeoIP changes to commit"
            exit 0
          fi

          git commit -m "Auto-update GeoIP report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
