name: GeoIP Report

on:
  schedule:
    - cron: '0 3 * * *'   # раз в сутки по UTC
  workflow_dispatch:

jobs:
  geoip-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoLite2 databases
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL --retry 3 -o data/GeoLite2-Country.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb
          curl -fsSL --retry 3 -o data/GeoLite2-ASN.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
          ls -lh data/

      - name: Run GeoIP pipeline
        run: python geoip_pipeline.py

      - name: Show report (debug)
        run: cat sources_meta/geoip_report.md || true

      - name: Commit GeoIP report if any
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"

          if [ ! -f sources_meta/geoip_report.md ]; then
            echo "::error::sources_meta/geoip_report.md was not produced by the pipeline"
            ls -la sources_meta 2>/dev/null || true
            exit 1
          fi

          git add sources_meta/geoip_report.md
          if git diff --cached --quiet; then
            echo "No GeoIP changes to commit"
            exit 0
          fi
          git commit -m "Auto-update GeoIP report [skip ci]"

      - name: Push
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.ref_name }}
